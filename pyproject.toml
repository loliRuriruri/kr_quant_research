[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kr-quant-research"
version = "1.0.0"
description = "Korean equity research: conservative Quant discovery plus market context, no order routing"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "KR Quant Research" }]
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=16",
  "duckdb>=1.1",
  "pyyaml>=6",
  "python-dotenv>=1.0",
  "requests>=2.32",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "typer>=0.12",
  "rich>=13",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "httpx>=0.27",
]
yahoo = [
  "yfinance>=0.2.40",
]

[project.scripts]
kr-quant-research = "kr_quant.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.package-data]
kr_quant = ["py.typed", "web/static/*"]
